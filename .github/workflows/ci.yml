name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  express:
    name: Express — typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-express/package-lock.json
      - run: npm ci --workspaces=false --include=dev
      - run: npm run lint:animations
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # ── Supabase / Deno: edge function unit tests ────────────────────────────────
  edge-functions:
    name: Edge Functions — Deno tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run shared utility tests
        run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/_shared/security.test.ts supabase/functions/_shared/notifications.test.ts
