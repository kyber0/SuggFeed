version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web-express"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # Monorepo dependencies & tooling (pnpm workspace root manages all packages and pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Group dependencies into a single PR so pnpm-lock.yaml updates cleanly across the workspace
    groups:
      dependencies:
        patterns:
          - "*"

  # GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
